<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy Birthday!</title>
    <style>
        body { background: #ffeef2; font-family: 'Arial'; text-align: center; overflow-x: hidden; }
        .card { background: white; border-radius: 20px; padding: 40px; margin-top: 50px; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #ff4757; font-size: 3em; animation: bounce 2s infinite; }
        .gift-btn { background: #ff4757; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 20px; cursor: pointer; transition: 0.3s; }
        .gift-btn:hover { transform: scale(1.1); background: #ff6b81; }
        #message { display: none; margin-top: 20px; font-size: 24px; color: #57606f; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>Happy Birthday Aqsa! 🎂</h1>
        <p>Aapke liye ek khaas tohfa...</p>
        <button class="gift-btn" onclick="showSurprise()">Click Here for Surprise! 🎁</button>
        <div id="message">
            <p>Aap jiyo hazaron saal! 🎈✨</p>
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJicnZ3ZzR2ZzR2ZzR2ZzR2ZzR2/l41lTfuxV6fS0pXHi/giphy.gif" width="200">
        </div>
    </div>

    <script>
        function showSurprise() {
            document.getElementById('message').style.display = 'block';
            confetti(); // Agar aap mazeed animations chahte hain
        }
    </script>
</body>
</html>
